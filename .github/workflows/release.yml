name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tags must look like v1.2.3: $version"
          }
          $prerelease = $version.Contains('-')
          "value=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "Release version: $version (prerelease: $prerelease)"

      - name: Restore
        run: dotnet restore WineCabinet.sln

      - name: Build
        run: dotnet build WineCabinet.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }} -p:InformationalVersion=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet run --project tests/WineCabinet.Tests/WineCabinet.Tests.csproj -c Release --no-build

      - name: Publish executables
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          foreach ($rid in @('win-x64', 'win-arm64')) {
            $output = Join-Path $root $rid
            dotnet publish src/WineCabinet/WineCabinet.csproj `
              --configuration Release `
              --runtime $rid `
              --self-contained true `
              -p:PublishProfile=$rid `
              -p:Version=$version `
              -p:InformationalVersion=$version `
              --output $output
            if ($LASTEXITCODE -ne 0) { throw "Publishing $rid failed with exit code $LASTEXITCODE." }

            $executable = Join-Path $output 'Wine Cabinet.exe'
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "The expected executable was not created: $executable"
            }
            $unexpected = @(Get-ChildItem -LiteralPath $output -File | Where-Object Name -ne 'Wine Cabinet.exe')
            if ($unexpected.Count -gt 0) {
              throw "Unexpected files were produced for ${rid}: $($unexpected.Name -join ', ')"
            }

            $archive = Join-Path $root "WineCabinet-$version-$rid.zip"
            Compress-Archive -LiteralPath $executable -DestinationPath $archive
            Write-Output "Packaged $archive"
          }

      - name: Write checksums
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          $lines = Get-ChildItem -LiteralPath $root -Filter 'WineCabinet-*.zip' |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          Set-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt') -Value $lines -Encoding utf8NoBOM
          Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt')

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          $arguments = @(
            'release', 'create', "v$version",
            '--title', "Wine Cabinet $version",
            '--generate-notes',
            (Join-Path $root "WineCabinet-$version-win-x64.zip"),
            (Join-Path $root "WineCabinet-$version-win-arm64.zip"),
            (Join-Path $root 'SHA256SUMS.txt')
          )
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') {
            $arguments += '--prerelease'
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed with exit code $LASTEXITCODE." }
          gh release view "v$version"
