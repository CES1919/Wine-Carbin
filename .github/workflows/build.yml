name: build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore WineCabinet.sln
      - name: Build
        run: dotnet build WineCabinet.sln -c Release --no-restore
      - name: Test
        run: dotnet run --project tests/WineCabinet.Tests/WineCabinet.Tests.csproj -c Release --no-build
      - name: Publish Windows x64
        shell: pwsh
        run: .\scripts\publish.ps1 -RuntimeIdentifier win-x64
      - name: Publish Windows ARM64
        shell: pwsh
        run: .\scripts\publish.ps1 -RuntimeIdentifier win-arm64
      - name: Verify single-file outputs
        shell: pwsh
        run: |
          $outputs = @(
            'artifacts\publish\win-x64\Wine Cabinet.exe',
            'artifacts\publish\win-arm64\Wine Cabinet.exe'
          )
          foreach ($output in $outputs) {
            if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
              throw "Missing self-contained executable: $output"
            }
          }
